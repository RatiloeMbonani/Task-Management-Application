<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management Application</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
   
</head>
<body>
    <!-- HEADER -->
<header class="header">
    <div class="logo">Task Mind</div>

    <input type="text" placeholder="Search..." class="search">

    <div class="header-icons">
        <span><i class="fas fa-bell"></i></span>
        <div class="profile-container">
  <span id="profile-icon">
    <i class="fas fa-user-circle"></i>
  </span>
   <div class="dropdown-menu" id="dropdown-menu">
    <a href="#"><i class="fas fa-cog"></i> Settings</a>
    <a href="#"><i class="fas fa-tools"></i> Tools</a>
    <a href="#"><i class="fas fa-question-circle"></i> Help</a>
    <a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
   </div>
   </div>
   
    </div>
</header>

    <div class="task-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <ul>
                <a href="dashboard.html"><li>Dashboard</li></a>
                <a href="myTasks.html"><li>My Tasks</li></a>
                <a href="calendar.html"><li>Calendar</li></a>
                <a href="analytics.html"><li>Analytics</li></a>
            </ul>
            <button class="new-task">+ New Task</button>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content-analytics">
            <h1>Analytics</h1>
            <div class="overview-analytics">
                <div class="card">
                    <h3>Tasks Completed</h3>
                    <p>7</p>
                </div>
                <div class="card">
                    <h3>Pending Tasks</h3>
                    <p>9</p>
                </div>
                <div class="card">
                    <h3>Total Tasks</h3>
                    <p>16</p>
                </div>
                <div class="card">
                    <h3>Upcoming Deadlines</h3>
                    <p>3</p>
                </div>
            </div>

            <!-- CHARTS -->
            <div class="charts">
                <div class="chart-card">
                    <h3>Task Completion by Category</h3>
                    <canvas id="categoryChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>Task Progress</h3>
                    <canvas id="progressChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <!-- CHART JS -->
    <script>
        // Category Breakdown Chart
        const ctxCategory = document.getElementById('categoryChart').getContext('2d');
        const categoryChart = new Chart(ctxCategory, {
            type: 'doughnut',
            data: {
                labels: ['Assignments', 'Exams', 'Quizzes', 'Extra-Curricular'],
                datasets: [{
                    label: 'Tasks by Category',
                    data: [3, 2, 3, 4], // from your task page
                    backgroundColor: ['#4f46e5','#f59e0b','#10b981','#f43f5e'],
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });

        // Task Progress Chart
        const ctxProgress = document.getElementById('progressChart').getContext('2d');
        const progressChart = new Chart(ctxProgress, {
            type: 'bar',
            data: {
                labels: ['ADF Group','Digital System','Mathematics','Computer Arch','Database','Machine Learning','Cloud Tech','Software Eng','Figma Project','Internship'],
                datasets: [{
                    label: 'Progress %',
                    data: [40,20,60,10,0,50,30,70,25,10],
                    backgroundColor: '#4f46e5'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>

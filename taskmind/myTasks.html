<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management Application</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header class="header">
    <div class="logo">Task Mind</div>
    <input type="text" placeholder="Search..." class="search">

    <div class="header-icons">
        <span><i class="fas fa-bell"></i></span>
        <div class="profile-container">
            <span id="profile-icon">
                <i class="fas fa-user-circle"></i>
            </span>
            <div class="dropdown-menu" id="dropdown-menu">
                <a href="#"><i class="fas fa-cog"></i> Settings</a>
                <a href="#"><i class="fas fa-tools"></i> Tools</a>
                <a href="#"><i class="fas fa-question-circle"></i> Help</a>
                <a href="#" data-logout="true"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </div>
</header>

<div class="task-container">
    <aside class="sidebar">
        <ul>
            <a href="dashboard.html"><li>Dashboard</li></a>
            <a href="myTasks.html"><li>My Tasks</li></a>
            <a href="calendar.html"><li>Calendar</li></a>
            <a href="analytics.html"><li>Analytics</li></a>
        </ul>

        <button class="new-task" id="add-task-btn">+ New Task</button>
    </aside>

    <div class="main-content-task">
        <h1>My Tasks</h1>

        <section class="task2-board">
            <div class="task-column">
                <button class="task-header">📚 Assignments</button>
                <div class="task-content"></div>
            </div>

            <div class="task-column">
                <button class="task-header">📝 Exams</button>
                <div class="task-content"></div>
            </div>

            <div class="task-column">
                <button class="task-header">🧪 Tests / Quizzes</button>
                <div class="task-content"></div>
            </div>

            <div class="task-column">
                <button class="task-header">🎨 Extra-Curricular</button>
                <div class="task-content"></div>
            </div>
        </section>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
